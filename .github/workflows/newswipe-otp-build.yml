name: NewSwipe OTP APK build
on:
  push:
    branches:
      - build-newswipe-otp-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/newswipe-tools
          curl --fail -L --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/newswipe-tools
          mv /tmp/newswipe-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build upstream NewSwipe with OTP consent source patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TechTree-Alt/NewSwipe.git newswipe
          cat newswipe-payload.part{1..7} > /tmp/newswipe-complete.b64
          base64 -d /tmp/newswipe-complete.b64 > /tmp/newswipe-source.tar.gz
          echo "90686e3957d69de4649af6f8c778af3b7cd0c174df269955a5eda8ffef138778  /tmp/newswipe-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/newswipe-source.tar.gz -C newswipe
          cd newswipe
          git apply --unidiff-zero --check NewSwipe-OTP.patch
          git apply --unidiff-zero NewSwipe-OTP.patch
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../built
          cp app/build/outputs/apk/debug/app-debug.apk ../built/NewSwipe-OTP-debug.apk
          sha256sum ../built/NewSwipe-OTP-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewSwipe-OTP-debug-apk
          path: built/NewSwipe-OTP-debug.apk
          if-no-files-found: error
