name: NewSwipe Samsung Pass compatible SMS OTP and photo clipboard
on:
  push:
    branches:
      - build-newswipe-samsungpass-otp-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/newswipe-tools
          curl --fail -L --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/newswipe-tools
          mv /tmp/newswipe-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Patch upstream NewSwipe OTP and photo quick paste
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TechTree-Alt/NewSwipe.git upstream-newswipe
          git -C upstream-newswipe checkout e0a07dc2a35012597c91c4a68c8059cdb74fb3af
          cat newswipe-payload.part{1..7} > /tmp/newswipe-complete.b64
          base64 -d /tmp/newswipe-complete.b64 > /tmp/newswipe-source.tar.gz
          echo "90686e3957d69de4649af6f8c778af3b7cd0c174df269955a5eda8ffef138778  /tmp/newswipe-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/newswipe-source.tar.gz -C upstream-newswipe
          cd upstream-newswipe
          git apply --unidiff-zero --check NewSwipe-OTP.patch
          git apply --unidiff-zero NewSwipe-OTP.patch
          python3 ../newswipe/apply_image_clip.py
          base64 -d ../newswipe/otpfix.b64 | gzip -d > ../newswipe/fix_otp.py
          python3 ../newswipe/fix_otp.py
          python3 ../newswipe/enable_sms_direct.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          assert s.count("versionCode = 21") == 1
          assert s.count('versionName = "1.9.1"') == 1
          assert s.count("    buildTypes {\n        release {") == 1
          s = s.replace("versionCode = 21", "versionCode = 25")
          s = s.replace('versionName = "1.9.1"', 'versionName = "1.9.5-sms"')
          s = s.replace("    buildTypes {\n        release {", '    buildTypes {\n        debug {\n            applicationIdSuffix = ".samsungotp"\n            versionNameSuffix = "-test"\n        }\n        release {')
          p.write_text(s)
          Path("app/src/debug/res/values").mkdir(parents=True, exist_ok=True)
          Path("app/src/debug/res/values/strings.xml").write_text('<resources><string name="app_name">NewSwipe 삼성패스</string></resources>\n')
          PY
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p ../built
          cp app/build/outputs/apk/debug/app-debug.apk ../built/NewSwipe-SamsungPass-TEST.apk
          cp app/build/outputs/apk/release/app-release.apk ../built/NewSwipe-SamsungPass-REPLACE.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ../built/NewSwipe-SamsungPass-TEST.apk | head -5
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../built/NewSwipe-SamsungPass-TEST.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../built/NewSwipe-SamsungPass-REPLACE.apk
          sha256sum ../built/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewSwipe-SamsungPass-apks
          path: built/*.apk
          if-no-files-found: error
