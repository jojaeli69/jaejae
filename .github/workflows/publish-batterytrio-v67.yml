name: Publish Battery Trio Mini v67 direct APK
on:
  push:
    branches: [gts4mini-batterylink-v13]
    paths:
      - '_dist/BatteryTrioMini_v67.apk.b64'
      - '.github/workflows/publish-batterytrio-v67.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gts4mini-batterylink-v13
      - name: Decode and verify signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          base64 -d _dist/BatteryTrioMini_v67.apk.b64 > downloads/BatteryTrioMini_v67.apk
          echo '5eb227ae3e59460de1e7980bbd9fa094f74146cb5669991b27e6f7553acc39e4  downloads/BatteryTrioMini_v67.apk' | sha256sum -c -
          unzip -t downloads/BatteryTrioMini_v67.apk >/dev/null
          unzip -Z1 downloads/BatteryTrioMini_v67.apk | grep -qx AndroidManifest.xml
          test "$(stat -c %s downloads/BatteryTrioMini_v67.apk)" -eq 78499
          echo 'Verified Battery Trio Mini v67 APK integrity: 78499 bytes'
      - name: Publish direct APK in GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BatteryTrioMini_v67.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Battery Trio Mini v67 APK [skip ci]'
            git push origin HEAD:gts4mini-batterylink-v13
          fi
