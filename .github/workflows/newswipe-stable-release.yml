name: NewSwipe stable in-place update signing
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEWSWIPE_KEYSTORE: /tmp/newswipe-personal-update.p12
      NEWSWIPE_KEYSTORE_PASSWORD: ${{ secrets.NEWSWIPE_SIGNING_PASSWORD }}
      NEWSWIPE_KEY_ALIAS: newswipe-stable
      NEWSWIPE_KEY_PASSWORD: ${{ secrets.NEWSWIPE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Load persistent signer from private GitHub Actions secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEWSWIPE_SIGNING_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$NEWSWIPE_KEYSTORE_PASSWORD" ]; then
            echo "::error::One-time setup required: configure NEWSWIPE_SIGNING_KEYSTORE_B64 and NEWSWIPE_SIGNING_PASSWORD repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$NEWSWIPE_KEYSTORE"
          chmod 600 "$NEWSWIPE_KEYSTORE"
          keytool -list -keystore "$NEWSWIPE_KEYSTORE" -storepass "$NEWSWIPE_KEYSTORE_PASSWORD" -alias "$NEWSWIPE_KEY_ALIAS" >/dev/null
          echo "Persistent release signing key loaded."
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/newswipe-tools
          curl --fail -L --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/newswipe-tools
          mv /tmp/newswipe-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Patch upstream NewSwipe OTP and photo quick paste
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TechTree-Alt/NewSwipe.git upstream-newswipe
          git -C upstream-newswipe checkout e0a07dc2a35012597c91c4a68c8059cdb74fb3af
          cat newswipe-payload.part{1..7} > /tmp/newswipe-complete.b64
          base64 -d /tmp/newswipe-complete.b64 > /tmp/newswipe-source.tar.gz
          echo "90686e3957d69de4649af6f8c778af3b7cd0c174df269955a5eda8ffef138778  /tmp/newswipe-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/newswipe-source.tar.gz -C upstream-newswipe
          cd upstream-newswipe
          git apply --unidiff-zero --check NewSwipe-OTP.patch
          git apply --unidiff-zero NewSwipe-OTP.patch
          python3 ../newswipe/apply_image_clip.py
          base64 -d ../newswipe/otpfix.b64 | gzip -d > ../newswipe/fix_otp.py
          python3 ../newswipe/fix_otp.py
          python3 ../newswipe/enable_sms_direct.py
          python3 ../newswipe/apply_translation.py
          python3 ../newswipe/apply_samsung_translate.py
          python3 ../newswipe/apply_native_translate.py
          python3 ../newswipe/patch_native_translate_v199.py
          python3 ../newswipe/fix_translate_edit_v200.py
          cp ../newswipe/AdaptiveTouch.java app/src/main/java/com/alternative_studios/newswipe/keyboard/AdaptiveTouch.java
          python3 ../newswipe/enable_adaptive_keyboard_v201.py
          cp ../newswipe/TouchBiasMath.java app/src/main/java/com/alternative_studios/newswipe/keyboard/TouchBiasMath.java
          cp ../newswipe/AdaptiveTouchV202.java app/src/main/java/com/alternative_studios/newswipe/keyboard/AdaptiveTouch.java
          mkdir -p /tmp/newswipe-touch-test
          javac -d /tmp/newswipe-touch-test ../newswipe/TouchBiasMath.java ../newswipe/TouchBiasMathTest.java
          java -cp /tmp/newswipe-touch-test com.alternative_studios.newswipe.keyboard.TouchBiasMathTest
          python3 ../newswipe/polish_translate_ui_v203.py
          python3 ../newswipe/patch_screenshot_paste_v204.py
          python3 ../newswipe/fix_live_screenshot_v205.py
          python3 ../newswipe/compact_clipboard_v206.py
          python3 ../newswipe/clipboard_limits_v207.py
          mkdir -p /tmp/newswipe-clipboard-test
          javac -d /tmp/newswipe-clipboard-test \
            app/src/main/java/com/alternative_studios/newswipe/clipboard/ClipboardHistory.java \
            ../newswipe/ClipboardLimitsTest.java
          java -cp /tmp/newswipe-clipboard-test \
            com.alternative_studios.newswipe.clipboard.ClipboardLimitsTest
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          assert s.count("versionCode = 21") == 1
          assert s.count('applicationId = "com.alternative_studios.newswipe"') == 1
          assert s.count('versionName = "1.9.1"') == 1
          assert s.count("    buildTypes {\n        release {") == 1
          s = s.replace("        versionCode = 21", "        ndk {\n            abiFilters.add(\"arm64-v8a\")\n        }\n        versionCode = 21")
          s = s.replace('applicationId = "com.alternative_studios.newswipe"', 'applicationId = "com.alternative_studios.newswipe.personal"')
          s = s.replace("versionCode = 21", "versionCode = 100")
          s = s.replace('versionName = "1.9.1"', 'versionName = "2.1.0-stable"')
          # Fixed application ID; no debug suffix in production release.
          p.write_text(s)
          Path("app/src/debug/res/values").mkdir(parents=True, exist_ok=True)
          Path("app/src/debug/res/values/strings.xml").write_text('<resources><string name="app_name">NewSwipe</string></resources>\n')
          PY
          sed -i '/^networkTimeout=/d' gradle/wrapper/gradle-wrapper.properties
          printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleRelease; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 8
          done
          mkdir -p ../built
          cp app/build/outputs/apk/release/app-release.apk ../built/NewSwipe-Stable-v210.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ../built/NewSwipe-Stable-v210.apk | head -5
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ../built/NewSwipe-Stable-v210.apk
          sha256sum ../built/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewSwipe-Stable-apk
          path: built/*.apk
          if-no-files-found: error
