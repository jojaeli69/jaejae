name: Publish Battery Trio v69 Direct BLE Auto APK
on:
  push:
    branches: [gts4mini-batterylink-v13]
    paths:
      - '_dist/BatteryTrioMini_v69.apk.b64'
      - '.github/workflows/publish-batterytrio-v69.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gts4mini-batterylink-v13
      - name: Decode and verify v69 Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          base64 -d _dist/BatteryTrioMini_v69.apk.b64 > downloads/BatteryTrioMini_v69.apk
          echo '08ec9c68538ac04af9ad8efea7d68d765519406c1f656517e88a0eac941d013b  downloads/BatteryTrioMini_v69.apk' | sha256sum -c -
          unzip -t downloads/BatteryTrioMini_v69.apk >/dev/null
          unzip -Z1 downloads/BatteryTrioMini_v69.apk | grep -qx AndroidManifest.xml
          test "$(stat -c %s downloads/BatteryTrioMini_v69.apk)" -eq 90785
          echo 'Verified Battery Trio Mini v69 APK integrity: 90785 bytes'
      - name: Publish direct APK in GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BatteryTrioMini_v69.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Battery Trio Mini v69 automatic read-only BLE battery monitoring [skip ci]'
            git push origin HEAD:gts4mini-batterylink-v13
          fi
