name: Publish Battery Trio Mini v66 direct APK
on:
  push:
    branches: [gts4mini-batterylink-v13]
    paths:
      - '_dist/BatteryTrioMini_v66.apk.b64'
      - '.github/workflows/publish-batterytrio-v66.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gts4mini-batterylink-v13
      - name: Decode and verify signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          base64 -d _dist/BatteryTrioMini_v66.apk.b64 > downloads/BatteryTrioMini_v66.apk
          echo '542175a3137c07c679a0c15286a50c6eeb50db43b3fea90fe22f46988045614c  downloads/BatteryTrioMini_v66.apk' | sha256sum -c -
          unzip -t downloads/BatteryTrioMini_v66.apk >/dev/null
          unzip -Z1 downloads/BatteryTrioMini_v66.apk | grep -qx AndroidManifest.xml
          test "$(stat -c %s downloads/BatteryTrioMini_v66.apk)" -eq 78497
          echo 'Verified Battery Trio Mini v66 APK integrity: 78497 bytes'
      - name: Publish direct APK in GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BatteryTrioMini_v66.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Battery Trio Mini v66 APK [skip ci]'
            git push origin HEAD:gts4mini-batterylink-v13
          fi
