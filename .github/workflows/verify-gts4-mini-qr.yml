name: Verify public Zepp QR install file
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-gts4-mini-qr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-download:
    runs-on: ubuntu-latest
    steps:
      - name: Verify anonymous ZPK download and ZIP integrity
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/jojaeli69/jaejae/codex/gts4-mini-probe-release/gts4-mini-public/GTS4Mini_MicProbe_PREVIEW.zpk'
          curl --retry 2 --max-time 20 -fLsS -D headers.txt -o mic-probe.zpk "$URL"
          printf 'Downloaded bytes: '
          wc -c < mic-probe.zpk
          unzip -t mic-probe.zpk
          python3 - <<'PY'
          import zipfile, io, json, time, hashlib
          raw=open('mic-probe.zpk','rb').read()
          with zipfile.ZipFile(io.BytesIO(raw)) as outer:
              for nested in ('device.zip','app-side.zip'):
                  with zipfile.ZipFile(io.BytesIO(outer.read(nested))) as inner:
                      info=json.loads(inner.read('app.json'))['packageInfo']
                      assert info['mode']=='preview', (nested, info)
                      assert int(info['timeStamp'])+int(info['expiredTime'])>int(time.time()), (nested,'expired')
                      print(nested,info)
          print('VERIFIED_ANONYMOUS_PREVIEW_ZPK', len(raw), hashlib.sha256(raw).hexdigest())
          PY
