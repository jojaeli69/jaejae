name: Build BatteryTrio Mini v82 phone full icon fix APK
on:
  push:
    branches: [batterytrio-v82-phone-full-icon-20261115]
    paths:
      - 'batterytrio-v82/**'
      - 'batterytrio-v81/**'
      - 'batterytrio-v80/**'
      - '.github/workflows/build-batterytrio-v82.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batterytrio-v82-phone-full-icon-20261115
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode v79 base and apply v80 + v81 changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p batterytrio-v80-src
          base64 -d batterytrio-v79-payload/source.tar.xz.b64 | xz -d | tar -x -C batterytrio-v80-src
          cp batterytrio-v79-payload/build_v79.sh batterytrio-v80-src/build_v79.sh
          python3 batterytrio-v80/patch_v80.py
          python3 batterytrio-v81/patch_v81.py
          python3 batterytrio-v82/patch_v82.py
          sed -i 's/org.example.galaxybatterybridge.history/org.example.galaxybatterybridge.v82/g' batterytrio-v80-src/build_v79.sh
          grep -q 'org.example.galaxybatterybridge.v82' batterytrio-v80-src/build_v79.sh
      - name: Run static Java battery movement tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/android:versionCode="10079"/android:versionCode="10082"/' batterytrio-v80-src/test_protocol.sh
          bash batterytrio-v80-src/test_protocol.sh
          mkdir -p /tmp/v80-classes
          javac -encoding UTF-8 -d /tmp/v80-classes \
            batterytrio-v80-src/app/src/main/java/org/example/galaxybatterybridge/MiniChargeHeuristic.java \
            batterytrio-v80-src/MiniChargeHeuristicTest.java
          java -cp /tmp/v80-classes org.example.galaxybatterybridge.MiniChargeHeuristicTest
          javac -encoding UTF-8 -d /tmp/v80-classes \
            batterytrio-v80-src/app/src/main/java/org/example/galaxybatterybridge/PhoneChargeRule.java \
            batterytrio-v80-src/PhoneChargeRuleTest.java
          java -cp /tmp/v80-classes org.example.galaxybatterybridge.PhoneChargeRuleTest
      - name: Ensure Android SDK available
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Generate isolated v82 signer (NOT an update to existing v80)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/v82-test.jks" \
            -storepass changeit -keypass changeit -alias gts4-test -keyalg RSA \
            -keysize 3072 -validity 3650 -dname "CN=BatteryTrioMini v82 Test,O=Local Test"
          echo "GTS4_SIGNING_KEY=$RUNNER_TEMP/v82-test.jks" >> "$GITHUB_ENV"
      - name: Build independent v82 APK
        shell: bash
        run: |
          set -euo pipefail
          cd batterytrio-v80-src
          ANDROID_SDK_ROOT="$ANDROID_HOME" bash build_v79.sh
          mkdir -p ../downloads
          cp BatteryTrioMini_v79.apk ../downloads/BatteryTrioMini_v82_Standalone.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging ../downloads/BatteryTrioMini_v82_Standalone.apk |
            grep -m 1 "package: name='org.example.galaxybatterybridge.v82'"
      - name: Verify package signature and build outputs
        run: |
          set -euo pipefail
          f=downloads/BatteryTrioMini_v82_Standalone.apk
          unzip -t "$f" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$f"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$f" | head -n 12
          sha256sum "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTrioMini-v82-PhoneFull-Standalone-APK
          path: downloads/BatteryTrioMini_v82_Standalone.apk
          if-no-files-found: error
      - name: Publish for download (does not overwrite original v80)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BatteryTrioMini_v82_Standalone.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish BatteryTrioMini v82 phone full icon APK [skip ci]"
            git push origin HEAD:batterytrio-v82-phone-full-icon-20261115
          fi
