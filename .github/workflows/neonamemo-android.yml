name: NeonaMemo Android build
on:
  push:
    paths:
      - 'android-client/**'
      - '.github/workflows/neonamemo-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble unsigned debug APK
        run: gradle -p android-client :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: neonamemo-native-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
