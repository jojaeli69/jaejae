name: Build GTS4 mini Alexa BLE capture (unofficial)
on:
  push:
    branches:
      - codex/gts4-mini-alexa-capture
    paths:
      - "gts4-mini-alexa/**"
      - ".github/workflows/gts4-mini-alexa-build.yml"
  pull_request:
    branches:
      - codex/gts4-mini-probe-release
    paths:
      - "gts4-mini-alexa/**"
      - ".github/workflows/gts4-mini-alexa-build.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gts4-mini-alexa-build
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Inspect preinstalled Android SDK (no deprecated sdkmanager)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms/" || true
          ls "$ANDROID_HOME/build-tools/" || true
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            echo "::error::Android API 34 platform absent on runner"
            exit 1
          fi
      - name: Clone a fixed upstream Gadgetbridge commit (AGPL-3.0)
        run: |
          git clone --depth 1 --branch master https://github.com/Freeyourgadget/Gadgetbridge.git upstream
          cd upstream
          ACTUAL=$(git rev-parse HEAD)
          echo "Upstream commit $ACTUAL"
          test "$ACTUAL" = "a0948ee1cbc2a870f91d313f8e37df5f524465f7"
      - name: Apply reviewed local-only Alexa capture patch
        run: |
          python3 gts4-mini-alexa/patch_gadgetbridge.py upstream --dry-run
          python3 gts4-mini-alexa/patch_gadgetbridge.py upstream
          test -f upstream/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/huami/zeppos/services/ZeppOsAlexaRawCapture.java
          grep -F 'handler.findPreference("zepp_os_alexa_btn_capture_once")' upstream/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/devices/huami/zeppos/ZeppOsSettingsCustomizer.java
          grep -F 'developer.add(R.xml.devicesettings_huami2021_alexa);' upstream/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/devices/huami/zeppos/ZeppOsCoordinator.java
          if grep -RFn "hmSensor.createSensor" gts4-mini-alexa/; then
            echo "Unexpected undocumented sensor call"
            exit 1
          fi
      - name: Replace unavailable JitPack DAO generator with published greenDAO
        run: |
          sed -i 's@com.github.Freeyourgadget:greendao:1998d7cd2d21f662c6044f6ccf3b3a251bbad341@org.greenrobot:greendao-generator:2.2.0@g' upstream/GBDaoGenerator/build.gradle
          grep "org.greenrobot:greendao-generator:2.2.0" upstream/GBDaoGenerator/build.gradle
      - name: Build independently installable debug-signed mainlineNopebble APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMainlineNopebble
      - name: Validate and stage APK
        run: |
          mkdir -p outputs
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -i nopebble | head -n 1)
          test -n "$APK"
          cp "$APK" outputs/GTS4Mini_AlexaCapture_Gadgetbridge_v3.1.apk
          file outputs/GTS4Mini_AlexaCapture_Gadgetbridge_v3.1.apk
          unzip -t outputs/GTS4Mini_AlexaCapture_Gadgetbridge_v3.1.apk | tail -n 2
          sha256sum outputs/GTS4Mini_AlexaCapture_Gadgetbridge_v3.1.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTS4Mini_AlexaCapture_Gadgetbridge_v3.1
          path: outputs/GTS4Mini_AlexaCapture_Gadgetbridge_v3.1.apk
          retention-days: 30
          if-no-files-found: error
