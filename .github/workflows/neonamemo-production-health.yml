name: NeonaMemo production API smoke test
on:
  push:
    paths:
      - '.github/workflows/neonamemo-production-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed Worker and isolated record lifecycle
        env:
          NNM_API: https://neonamemo-api.qhdwhxkd.workers.dev
        run: |
          python3 - <<'PY'
          import os, json, secrets, base64, urllib.request, urllib.error, datetime, time
          base=os.environ["NNM_API"]
          def request(path, method="GET", obj=None, token=None):
              data=None if obj is None else json.dumps(obj).encode("utf-8")
              req=urllib.request.Request(base+path,data=data,method=method)
              req.add_header("Accept","application/json")
              if data is not None: req.add_header("Content-Type","application/json")
              if token: req.add_header("x-nnm-workspace-key",token)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code,json.load(e)
          status,health=request("/health")
          assert status==200 and health.get("ok"),f"Production health unreachable: {status} {health}"
          print("Deployed syncBuild:",health.get("syncBuild"))
          assert health.get("syncBuild")=="r2-delete-guard-20261110","Production Worker has NOT deployed delete guard"
          assert health.get("checks",{}).get("devices"),"DEVICES KV not bound"
          assert health.get("checks",{}).get("sharedR2"),"FILES_R2 bucket not bound"
          print("PASS: production Worker version and R2/KV bindings")
          status,j=request("/v1/share/items?kind=record")
          assert status==401,f"Unauthenticated share endpoint returned {status}"
          print("PASS: unauthenticated requests blocked")
          token=secrets.token_hex(32)
          item_id="probe_"+secrets.token_hex(8)
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          def timestamp(add):
              return (now+datetime.timedelta(seconds=add)).isoformat(timespec="milliseconds").replace("+00:00","Z")
          # Synthetic metadata test, no real user/workspace data and no user token.
          ciphertext=base64.b64encode(secrets.token_bytes(12)).decode()+"."+base64.b64encode(secrets.token_bytes(20)).decode()
          post={"kind":"record","id":item_id,"mtime":timestamp(0),"data":ciphertext,"deleted":False}
          status,j=request("/v1/share/items","POST",post,token)
          assert status==200 and j.get("saved"),f"Create failed: {status} {j}"
          print("PASS: isolated test record created")
          status,j=request("/v1/share/items?kind=record",token=token)
          assert status==200 and any(x.get("id")==item_id and not x.get("deleted") for x in j.get("items",[])),f"Read-after-write failed: {status} {j}"
          print("PASS: record immediately readable across connections")
          tomb={**post,"mtime":timestamp(5),"deleted":True}
          status,j=request("/v1/share/items","POST",tomb,token)
          assert status==200 and j.get("saved"),f"Delete tombstone failed: {status} {j}"
          status,j=request("/v1/share/items?kind=record",token=token)
          assert status==200 and any(x.get("id")==item_id and x.get("deleted") for x in j.get("items",[])),f"Delete not reflected: {status} {j}"
          print("PASS: deletion seen in shared list")
          revive={**post,"mtime":timestamp(10)}
          status,j=request("/v1/share/items","POST",revive,token)
          assert status==409,f"Unexpected deleted-record resurrection response: {status} {j}"
          print("PASS: old client cannot resurrect deleted record")
          print("ALL PRODUCTION API SMOKE TESTS PASSED; only isolated synthetic test data created")
          PY
